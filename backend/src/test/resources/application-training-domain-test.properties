# Create webkorps_training_test and set WTP_TEST_DB_USERNAME/WTP_TEST_DB_PASSWORD before running this test.
# This dedicated schema is never the application database.
spring.datasource.url=jdbc:mysql://localhost:3306/webkorps_training_test
spring.datasource.username=${WTP_TEST_DB_USERNAME}
spring.datasource.password=${WTP_TEST_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
