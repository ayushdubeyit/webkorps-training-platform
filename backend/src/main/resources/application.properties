spring.application.name=training-platform





# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/webkorps_training
spring.datasource.username=training_app
spring.datasource.password=Training@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

#jwt
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# Initial Manager Account
app.bootstrap.manager.name=Platform Manager
app.bootstrap.manager.email=manager@webkorps.com
app.bootstrap.manager.password=${MANAGER_PASSWORD}

logging.level.org.springframework.security=TRACE

# Local PDF storage: keep files outside classpath static/public directories.
app.training.file-storage.location=${WTP_FILE_STORAGE_PATH:./data/training-files}
app.training.file-storage.max-file-size=${WTP_MAX_PDF_SIZE:10MB}
spring.servlet.multipart.max-file-size=${WTP_MAX_PDF_SIZE:10MB}
spring.servlet.multipart.max-request-size=${WTP_MAX_PDF_REQUEST_SIZE:11MB}
